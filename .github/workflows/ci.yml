name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodtech
          POSTGRES_PASSWORD: foodtech
          POSTGRES_DB: foodtech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodtech"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://foodtech:foodtech@localhost:5432/foodtech
          TEST_DATABASE_URL: postgresql+psycopg://foodtech:foodtech@localhost:5432/foodtech_test
