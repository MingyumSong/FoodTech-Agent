services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: foodtech
      POSTGRES_PASSWORD: foodtech
      POSTGRES_DB: foodtech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodtech"]
      interval: 3s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://foodtech:foodtech@postgres:5432/foodtech
      JOBS_TOKEN: ${JOBS_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
